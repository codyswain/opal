<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>
      Opal
    </title>
    <script>
      // Runs before any bundle parses, so the first painted frame already has
      // the right theme. Without this the window paints light, then React
      // mounts and swaps to dark — a visible flash on every launch.
      // Mirrors the preference schema and defaults in
      // src/renderer/features/theme/config/themeConfig.ts. Keep them in sync.
      (function () {
        var resolvedTheme = 'light';
        try {
          var theme = null;
          var stored = window.localStorage.getItem('opal.theme');
          if (stored) {
            try {
              var envelope = JSON.parse(stored);
              var value = envelope && envelope.version === 1
                ? envelope.value
                : null;
              if (value === 'system' || value === 'light' || value === 'dark') {
                theme = value;
              }
            } catch (error) {
              // Ignore a corrupt cosmetic preference and try the legacy key.
            }
          }

          // One-cycle fallback for users upgrading from the old bare key.
          if (!theme) {
            var legacy = window.localStorage.getItem('theme');
            if (legacy === 'light' || legacy === 'dark') theme = legacy;
          }

          theme = theme || 'system';
          resolvedTheme = theme === 'system' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : theme === 'dark'
                ? 'dark'
                : 'light';
        } catch (error) {
          resolvedTheme =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.classList.add(resolvedTheme);
        document.documentElement.style.colorScheme = resolvedTheme;
      })();
      // The same for variants whose version B is a set of tokens: each one
      // on B gets its data-<name> attribute before the first frame. Mirrors
      // the opal.variants envelope that rootVariants.ts in
      // src/renderer/features/variants writes. Keep them in sync.
      (function () {
        try {
          var stored = window.localStorage.getItem('opal.variants');
          var envelope = stored ? JSON.parse(stored) : null;
          var sides = envelope && envelope.version === 1 ? envelope.value : null;
          if (!sides || typeof sides !== 'object') return;
          for (var name in sides) {
            if (
              Object.prototype.hasOwnProperty.call(sides, name) &&
              sides[name] === 'b' &&
              /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(name) &&
              name.length <= 64
            ) {
              document.documentElement.setAttribute('data-' + name, '');
            }
          }
        } catch (error) {
          // A corrupt cosmetic mirror reads as all on A until the sides load.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
